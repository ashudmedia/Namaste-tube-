    :root {
      --bg: #0F0F0F;
      --bg-secondary: #272727;
      --text: #F1F1F1;
      --text-secondary: #AAAAAA;
      --border: #3F3F3F;
      --hover: #3D3D3D;
      --saffron: #FF9933;
      --green: #138808;
      --chakra-blue: #000080;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 56px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .logo .saffron { color: var(--saffron); }
    .logo .green { color: var(--green); }

    .search-bar {
      display: flex;
      max-width: 600px;
      flex: 1;
      margin: 0 40px;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 16px;
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 40px 0 0 40px;
      color: var(--text);
      outline: none;
    }
    .search-bar button {
      padding: 0 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-left: 0;
      border-radius: 0 40px 40px 0;
      cursor: pointer;
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--hover); }

      display: none;
    }
