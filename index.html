<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>���मस्ते वीडियो ट्यूब - पार्टनर प्रोग्राम</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --kesari: #FF9933;
            --safed: #FFFFFF;
            --hara: #138808;
            --dark-bg: #0a0e14;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f2e 100%);
            color: var(--safed);
            min-height: 100vh;
        }
        
        header { 
            background: rgba(10, 14, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            border-bottom: 1px solid var(--border);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo-area b {
            color: var(--kesari);
            font-size: 26px;
            font-family: 'Baloo 2', sans-serif;
            letter-spacing: 1px;
        }
        
        .main-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .partner-section { 
            background: var(--glass);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        h2 {
            font-family: 'Baloo 2', sans-serif;
            color: var(--kesari);
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--safed);
        }
        
        input, select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            color: var(--safed);
            width: 100%;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--kesari);
            box-shadow: 0 0 10px rgba(255, 153, 51, 0.2);
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .sub-btn {
            background: linear-gradient(45deg, var(--kesari), #ff6a00);
            border: none;
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .sub-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 153, 51, 0.4);
        }
        
        .sub-btn:active {
            transform: translateY(0);
        }
        
        .success-message {
            background: rgba(19, 136, 8, 0.2);
            border: 1px solid var(--hara);
            color: #90EE90;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .error-message {
            background: rgba(255, 50, 50, 0.2);
            border: 1px solid #FF3232;
            color: #FF6B6B;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <b>🙏 नमस्ते ट्यूब</b>
        </div>
    </header>
    
    <div class="main-container">
        <div class="partner-section">
            <h2>पार्टनर प्रोग्राम</h2>
            
            <div class="success-message" id="successMsg">
                ✅ आपकी जानकारी सफलतापूर्वक जमा की गई है!
            </div>
            
            <div class="error-message" id="errorMsg">
                ❌ कृपया सभी फील्ड सही से भरें।
            </div>
            
            <form id="partnerForm">
                <div class="form-group">
                    <label for="name">आपका नाम *</label>
                    <input type="text" id="name" name="name" placeholder="पूरा नाम दर्ज करें" required>
                </div>
                
                <div class="form-group">
                    <label for="email">ईमेल *</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">फोन नंबर *</label>
                    <input type="tel" id="phone" name="phone" placeholder="10 अंक का नंबर" pattern="[0-9]{10}" required>
                </div>
                
                <div class="form-group">
                    <label for="channel">आपका चैनल नाम *</label>
                    <input type="text" id="channel" name="channel" placeholder="अपने चैनल का नाम दर्ज करें" required>
                </div>
                
                <div class="form-group">
                    <label for="category">कंटेंट कैटेगरी *</label>
                    <select id="category" name="category" required>
                        <option value="">-- कैटेगरी चुनें --</option>
                        <option value="education">शिक्षा</option>
                        <option value="entertainment">मनोरंजन</option>
                        <option value="music">संगीत</option>
                        <option value="tech">तकनीक</option>
                        <option value="lifestyle">लाइफस्टाइल</option>
                        <option value="other">अन्य</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="subscribers">अनुमानित सदस्य संख्या *</label>
                    <input type="number" id="subscribers" name="subscribers" placeholder="0" min="0" required>
                </div>
                
                <button type="submit" class="sub-btn">पार्टनर के लिए आवेदन करें</button>
            </form>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 नमस्ते ट्यूब। सर्वाधिकार सुरक्षित।</p>
    </footer>
    
    <!-- Firebase Configuration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        // Your Firebase Config (Replace with your actual config)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        document.getElementById('partnerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            try {
                const formData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    channel: document.getElementById('channel').value,
                    category: document.getElementById('category').value,
                    subscribers: document.getElementById('subscribers').value,
                    timestamp: new Date().toISOString()
                };
                
                const newRef = push(ref(database, 'partner_applications'));
                await set(newRef, formData);
                
                successMsg.style.display = 'block';
                document.getElementById('partnerForm').reset();
                
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 5000);
                
            } catch (error) {
                console.error('Error:', error);
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
